server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: iam-platform

  # 数据源（Druid）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/iam_platform?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      stat-view-servlet:
        enabled: true

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyBySnakeCaseImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Jackson
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# JWT 配置
jwt:
  secret: iam-platform-secret-key-please-change-in-production-2026
  access-token-expire: 7200        # 访问令牌有效期（秒），2小时
  refresh-token-expire: 604800     # 刷新令牌有效期（秒），7天
  issuer: iam-platform

# 加密脱敏配置
crypto:
  aes-key: iam-aes-256-key-please-change-in-production
  # 姓名脱敏：保留姓氏
  name-mask-rule: KEEP_SURNAME
  # 电话脱敏：中间四位掩码
  phone-mask-rule: MIDDLE_MASK

# 审计日志配置
audit:
  # 日志永久保存，不自动删除
  auto-delete: false
  # 异步写入线程池大小
  async-pool-size: 4

# 权限缓存配置
permission:
  cache:
    # 权限快照缓存 TTL（秒）
    ttl: 300
    # 缓存 key 前缀
    prefix: "iam:perm"
  # 分布式锁前缀
  lock-prefix: "iam:lock"

logging:
  level:
    com.iam.platform: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
