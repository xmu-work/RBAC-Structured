<text x="650" y="878" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03030">N</text>
<rect x="80" y="130" width="340" height="190" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M88,130 H412 Q420,130 420,138 V178 H80 V138 Q80,130 88,130 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="96" y="152" font-size="18" font-weight="bold" fill="#173b6b">多系统</text>
<text x="96" y="171" font-size="12" fill="#49678f">iam_system</text>
<text x="96" y="202" font-size="13" fill="#202a36">PK  id</text>
<text x="96" y="226" font-size="13" fill="#202a36">UK  system_code</text>
<text x="96" y="250" font-size="13" fill="#202a36">     system_name</text>
<text x="96" y="274" font-size="13" fill="#202a36">     status / callback_url</text>
<rect x="700" y="220" width="380" height="220" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M708,220 H1072 Q1080,220 1080,228 V268 H700 V228 Q700,220 708,220 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="716" y="242" font-size="18" font-weight="bold" fill="#173b6b">权限（前端菜单/按钮树）</text>
<text x="716" y="261" font-size="12" fill="#49678f">iam_permission</text>
<text x="716" y="292" font-size="13" fill="#202a36">PK  id</text>
<text x="716" y="316" font-size="13" fill="#202a36">FK  system_id  → iam_system</text>
<text x="716" y="340" font-size="13" fill="#202a36">FK  parent_id  → iam_permission（自关联）</text>
<text x="716" y="364" font-size="13" fill="#202a36">UK  system_id + permission_code</text>
<text x="716" y="388" font-size="13" fill="#202a36">     permission_type：MENU / BUTTON</text>
<text x="716" y="412" font-size="13" fill="#202a36">     route_path / action / sort_no</text>
<rect x="1340" y="190" width="360" height="220" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M1348,190 H1692 Q1700,190 1700,198 V238 H1340 V198 Q1340,190 1348,190 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="1356" y="212" font-size="18" font-weight="bold" fill="#173b6b">API（后端接口）</text>
<text x="1356" y="231" font-size="12" fill="#49678f">iam_api</text>
<text x="1356" y="262" font-size="13" fill="#202a36">PK  id</text>
<text x="1356" y="286" font-size="13" fill="#202a36">FK  system_id    → iam_system</text>
<text x="1356" y="310" font-size="13" fill="#202a36">FK  permission_id → iam_permission</text>
<text x="1356" y="334" font-size="13" fill="#202a36">UK  system_id + api_code</text>
<text x="1356" y="358" font-size="13" fill="#202a36">UK  api_path + http_method</text>
<text x="1356" y="382" font-size="13" fill="#202a36">     api_name / status</text>
<rect x="700" y="520" width="340" height="170" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M708,520 H1032 Q1040,520 1040,528 V568 H700 V528 Q700,520 708,520 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="716" y="542" font-size="18" font-weight="bold" fill="#173b6b">角色</text>
<text x="716" y="561" font-size="12" fill="#49678f">iam_role</text>
<text x="716" y="592" font-size="13" fill="#202a36">PK  id</text>
<text x="716" y="616" font-size="13" fill="#202a36">UK  role_code</text>
<text x="716" y="640" font-size="13" fill="#202a36">     role_name / status</text>
<text x="716" y="664" font-size="13" fill="#202a36">     parent_id（角色继承，可选）</text>
<rect x="70" y="780" width="390" height="210" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M78,780 H452 Q460,780 460,788 V828 H70 V788 Q70,780 78,780 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="86" y="802" font-size="18" font-weight="bold" fill="#173b6b">分层组织部门</text>
<text x="86" y="821" font-size="12" fill="#49678f">iam_org</text>
<text x="86" y="852" font-size="13" fill="#202a36">PK  id</text>
<text x="86" y="876" font-size="13" fill="#202a36">FK  parent_id → iam_org（自关联）</text>
<text x="86" y="900" font-size="13" fill="#202a36">UK  org_code</text>
<text x="86" y="924" font-size="13" fill="#202a36">     org_name / org_type / org_level</text>
<text x="86" y="948" font-size="13" fill="#202a36">     ancestors：分层路径</text>
<rect x="650" y="820" width="360" height="190" rx="8" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<path d="M658,820 H1002 Q1010,820 1010,828 V868 H650 V828 Q650,820 658,820 Z" fill="#eaf2fd" stroke="#1f4e8c" stroke-width="2"/>
<text x="666" y="842" font-size="18" font-weight="bold" fill="#173b6b">用户</text>
<text x="666" y="861" font-size="12" fill="#49678f">iam_user</text>
<text x="666" y="892" font-size="13" fill="#202a36">PK  id</text>
<text x="666" y="916" font-size="13" fill="#202a36">UK  user_no</text>
<text x="666" y="940" font-size="13" fill="#202a36">FK  org_id → iam_org</text>
<text x="666" y="964" font-size="13" fill="#202a36">     name_enc / phone_enc（加密）</text>
<text x="666" y="988" font-size="13" fill="#202a36">     account_status / post</text>
<line x1="60" y1="1060" x2="1740" y2="1060" stroke="#c9d1da" stroke-width="1"/>
<polygon points="80,1085 110,1072 140,1085 110,1098" fill="#fff4cf" stroke="#9a7a22" stroke-width="2"/>
<text x="155" y="1090" font-size="13" fill="#303946">联系（关联表不再画成独立实体）</text>
<rect x="430" y="1071" width="28" height="24" rx="5" fill="#fff" stroke="#1f4e8c" stroke-width="2"/>
<text x="475" y="1090" font-size="13" fill="#303946">六个业务实体</text>
<text x="660" y="1090" font-size="13" fill="#8a2b2b">1 / N / M 为参与基数</text>
<text x="930" y="1090" font-size="13" fill="#303946">鉴权链：请求 API → 所属权限 → 用户角色授予的权限；前端隐藏菜单不能替代后端 API 校验</text></svg>
